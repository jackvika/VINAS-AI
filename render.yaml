# Render reads this file when you choose New > Blueprint.
services:
  - type: web
    name: vinas-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Optional. With a value, the site asks for this password.
      - key: SITE_PASSWORD
        sync: false
