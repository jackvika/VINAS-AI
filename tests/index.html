<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tests | VINAS AI</title>
</head>
<body>
<pre id="out">Running</pre>
<script src="../static/rules.js"></script>
<script src="../static/content.js"></script>
<script src="../static/checker.js"></script>
<script src="../static/brain.js"></script>
<script src="../static/engine.js"></script>
<script src="../static/pdf.js"></script>
<script src="cases.js"></script>
<script>
const h = new Humanizer(RULES);
const out = [];
let passed = 0;
let failed = 0;

function check(kind, input, want, got) {
    if (JSON.stringify(want) === JSON.stringify(got)) {
        passed++;
    } else {
        failed++;
        out.push(`FAIL ${kind}\n  in:   ${input}\n  want: ${JSON.stringify(want)}\n  got:  ${JSON.stringify(got)}`);
    }
}
const text = (input, options) => h.run(input, options).text;
const hits = (r) => [...r.edits, ...r.flags].map((x) => x.pattern);

function run() {
    for (const [input, want] of TESTS.rewrites) {
        check('rewrite', input, want, text(input));
        check('stable', want, want, text(want));
    }
    for (const input of TESTS.untouched) check('untouched', input, input, text(input));
    for (const [input, n] of TESTS.flagged) check('flag', input, true, h.run(input).flags.some((f) => f.pattern === n));
    for (const [input, want] of TESTS.strong) check('strong', input, want, text(input, { strong: true }));
    for (const [input, want] of TESTS.human) check('human', input, want, text(input, { human: true }));
    for (const [input, options, want] of TESTS.recorded) check('recorded ' + JSON.stringify(options), input, want, text(input, options));

    // Patterns SKILL.md marks weak alone must be left when nothing else is wrong.
    const weak = [10, 11, 14, 21];
    for (const [n, kind, input] of TESTS.skill) {
        const found = hits(h.run(input, { type: n === 26 ? 'reply' : 'general' }));
        if (kind === 'After') {
            check(`After §${n}`, input, [], found);
            check(`After strong §${n}`, input, input, text(input, { strong: true }));
        } else {
            check(`Before §${n}`, input, !weak.includes(n), found.includes(n));
        }
    }

    // Options
    check('keep dashes', '', 'A — b, it is important — yes.', text('A — b, it is crucial — yes.', { dashes: true }));
    check('informal lone tell', '', 'lol that was crucial', text('lol that was crucial', { type: 'informal' }));
    check('human informal', '', 'i am fine, it is ok lmk', text('i am fine, it is ok lmk', { human: true, type: 'informal' }));
    check('human reference', '', 'To start, it is not safe. However, the team can.', text('In order to start, it is not safe. However, the team is able to.', { human: true, type: 'reference' }));
    check('tips', '', ['vague', 'in recent years'], h.run('It grew in recent years.', { human: true }).tips[0]);
    check('tips only in human', '', [], h.run('It grew in recent years.', { strong: true }).tips);
    const sample = "I don't think it's that hard — honestly we didn't plan much, and the trip was still vibrant and good. We can't complain about any of it.";
    check('voice', '', "The town is vibrant and we don't mind — it is an important stop — at all.", text('The town is vibrant and we do not mind — it is a crucial stop — at all.', { sample }));
    check('voice long', '', 'We do not help and cannot stay, it was important.', text("We don't help and can't stay, it was crucial.", { sample: 'We do not know what the plan is and we are not sure. '.repeat(3) }));

    // File mode, facts and highlight positions
    const md = '---\ntitle: A crucial — plan\n---\n\n# Notes\n\nThis is a crucial step. See [the guide](docs/crucial--a.md).\n\n| crucial | a — b |\n\n$ delve into --now\n\nC:\\work\\crucial\\x.txt\n\n```\ncrucial — code\n```';
    const file = h.run(md, { strong: true });
    check('file', '', md.replace('a crucial step', 'an important step'), file.text);
    check('sections', '', 2, file.sections);
    check('missing', '', ['12', 'https://a.example/x', 'Lisbon'], h.missing('We saw 12 cats in Lisbon at https://a.example/x today.', 'We saw cats today.'));
    check('missing after a heading', '', [], h.missing('Top Management\nThis is the top.', 'Top Management\nIt is the top.'));
    const r = h.run('Ünïcode — “quoted” 🚀 text. Experts believe it helps, ensuring a robust result.');
    for (const f of r.flags) check('offset', r.text, f.text, r.text.slice(f.start, f.end));

    // The checker of the AI writer. The bad drafts are ones real models wrote.
    const social = 'Social media has revolutionized the way in which people communicate and share information. It has enabled individuals to connect with others across the globe, thereby fostering a sense of community. Nevertheless, excessive utilization of social media can have detrimental effects on mental health.';
    const laptop = 'When choosing a laptop, there are several key factors to consider. Firstly, the processor plays a vital role in determining the overall performance of the device. The Dell XPS 13, priced at $1,199, provides an excellent balance of performance and portability.';
    const time = 'Breaking down larger projects into smaller, manageable steps can help you stay focused. Ultimately, time management is not just about getting more done; it is about creating a healthier work-life balance.';
    const climate = 'Rising global temperatures have led to a multitude of environmental consequences, such as melting ice caps, rising sea levels, and increasingly severe weather events.';
    const tower = 'The Eiffel Tower, constructed in 1889, stands as a testament to human ingenuity. Located in the heart of Paris, it attracts approximately seven million visitors annually.';
    const good = [
        [social, 'Social media has changed how we communicate and share information. It helps us connect with people all over the world, making us feel part of a community. However, using social media too much can be bad for our mental health.'],
        [laptop, "When buying a laptop, there are several things to think about. First, the processor matters a lot for the device's overall performance. The Dell XPS 13, priced at $1,199, strikes a great balance between performance and portability."],
        [tower, 'Built in 1889, the Eiffel Tower is a symbol of human ingenuity. You will find it in Paris, where it draws around seven million visitors each year.'],
        ['Please do not hesitate to reach out should you have any questions or require further information about the project.', 'Please get in touch if you have any questions or need more information about the project.'],
        ['Time management is not just about getting more done; it is about creating a healthier balance between work and life.', "Time management isn't simply about getting more done, but about building a healthier balance between work and life."],
        ['Walking is an accessible form of exercise that requires minimal equipment, so it suits people of all ages.', "It's an easy way to exercise since you don't need much equipment, so it works for people of all ages."],
        ['Many hospitals now use AI-powered diagnostic tools that find serious diseases at an early stage.', 'Many hospitals now rely on diagnostic tools powered by AI, which find serious diseases early.'],
    ];
    for (const [a, b] of good) check('good draft', a, '', Checker.judge(a, b, { keep: 0.25, add: 0.75 }).why);
    const bad = [
        [laptop, 'When picking a laptop, think about the processor and how it keeps your device running well, since it decides the performance. The Dell XPS 13 is a great choice with an excellent balance of performance and portability.', 'lost 13'.replace('13', '1199')],
        [laptop, laptop.replace('When choosing a laptop, there are', 'If you want a laptop, think about').replace('$1,199', '$1,299'), 'lost 1199'],
        [time, 'Breaking down larger projects into small steps helps you stay focused. It is ultimately not about getting more done and is about creating a healthier work-life balance.', 'changed a yes to a no'],
        [climate, 'High global temperatures have led to a wide variety of environmental consequences such as rising sea levels, rising sea levels and rising droughts.', 'repeats a phrase'],
        [tower, 'Built in 1889, the Eiffel Tower is a symbol of human ingenuity. It sits in Lyon and Paris, and around seven million visitors come each year.', 'invented Lyon'],
        [tower, 'Built in 1889, the Eiffel Tower is a symbol of human ingenuity. You will find it in Paris, where it draws around eight million visitors each year.', 'lost seven'],
        [tower, tower, 'barely changed'],
        ['Walking needs little equipment, so this kind of exercise is suitable for people of all ages.', 'You need little equipment to walk, so this kind of exercise suits people of almost any age.', 'changed how much'],
        ['The medicine is safe for children who are older than ten years of age.', 'The medicine is not safe for children who are more than ten years old.', 'changed a yes to a no'],
        ['The structure was initially met with criticism when it opened in the city.', 'They started off with a lot of criticism when they opened in the city.', 'lost its subject'],
        ['However, it has subsequently become one of the most iconic landmarks in the world.', 'But now it is probably the most famous landmark in the world.', 'claims too much'],
        [tower, 'It is a tower.', 'too short'],
        [tower, 'Built in 1889, the Eiffel Tower is a symbol of human ingenuity. You will find it in Paris, where it draws around seven million', 'cut off'],
        [social, 'Bananas grow quickly when the weather stays warm, and farmers pick them by hand before shipping each bunch to markets. Shoppers then buy them cheaply, eat them at breakfast, or bake them into sweet bread at home.', 'lost too much meaning'],
        ['She said "we will win" and left the long meeting early.', 'She told them "we may win" and then left the long meeting early.', 'changed a quotation'],
        ['Write to help@example.com before Friday if you need any more help.', 'If you need more help, write to us before Friday at our address.', 'lost a link'],
    ];
    for (const [a, b, why] of bad) check('bad draft', b, why, Checker.judge(a, b).why);
    check('clean', '', 'It works well.', Checker.clean('Sure! Here it is.\n\nHere is the rewritten text: "It works well."', 'It is functional.'));
    check('clean think', '', 'It works.', Checker.clean('<think>hmm</think>\n\nIt works.<|im_end|>', 'It is functional.'));
    for (const t of [md, social + '\n\n' + laptop, '', '\n', 'a\n\n\nb', '# T\n\n' + tower + '\n- x\n\n\tcode', '```\n' + social + '\n```\n' + social]) {
        check('pieces keep the text', t, t, Checker.pieces(t).map((p) => p.text + p.end).join(''));
    }
    check('pieces skip', '', [], Checker.pieces('```\n' + social + '\n```\n# ' + social + '\n| ' + social + ' |\n> ' + social + '\nSee `x`. ' + social).filter((p) => p.write));
    check('pieces split', '', true, Checker.pieces(Array(12).fill(social).join(' ')).every((p) => p.text.split(' ').length < 70 && p.write));
    check('must keep', '', ['$1,199', '16', '40%', 'seven', 'Dell', 'XPS'], Checker.mustKeep('The Dell XPS costs $1,199, has 16 ports, and 40% of seven buyers like it.').sort((a, b) => ['$1,199', '16', '40%', 'seven', 'Dell', 'XPS'].indexOf(a) - ['$1,199', '16', '40%', 'seven', 'Dell', 'XPS'].indexOf(b)));
    const notes = 'I sold 40 of them in Pune\nI do not like the colour';
    const shop = 'Small shops often struggle to attract customers when larger competitors open in the same neighbourhood.';
    check('notes allowed', '', '', Checker.judge(shop, 'When a larger competitor opens in the same neighbourhood, small shops often find it hard to attract customers. I sold 40 of them in Pune.', { keep: 0.25, add: 0.75, extra: notes }).why);
    check('notes needed', '', 'invented 40', Checker.judge(shop, 'When a larger competitor opens nearby, 40 small shops often find it hard to attract customers.', { keep: 0.25, add: 0.75 }).why);
    check('notes do not allow others', '', 'invented 41', Checker.judge(shop, 'When a larger competitor opens in the same neighbourhood, small shops often find it hard to attract customers. I sold 41 of them.', { keep: 0.25, add: 0.75, extra: notes }).why);
    check('told', '', [true, false], [Checker.tells('Last June I sold 40 of them in Pune.', 'I sold 40 of them in Pune'), Checker.tells('I sold some of them in Pune.', 'I sold 40 of them in Pune')]);
    const listText = 'Intro paragraph that has quite enough words to be written again by the writer.\n\nPrimary Functions:\n\nStrategic planning: Defining the mission and setting long-term goals for everyone.\n\n**Policy formulation:** Creating the broad frameworks that guide the rest.\n- Plain bullet that has more than enough words in it.\n\nConclusion\nA closing paragraph that has quite enough words to be written again by the writer.\n';
    const listPieces = Checker.pieces(listText);
    const list = listPieces.find((p) => p.items);
    check('list keeps the text', '', listText, listPieces.map((p) => p.text + p.end).join(''));
    check('list items', '', [['Strategic planning', 'Defining the mission and setting long-term goals for everyone.'], ['Policy formulation', 'Creating the broad frameworks that guide the rest.'], ['', 'Plain bullet that has more than enough words in it.']], list.items.map((x) => [x.label, x.body]));
    list.items[1].body = 'New wording.';
    Checker.settle(list);
    check('list settles', '', listText.replace('Creating the broad frameworks that guide the rest.', 'New wording.'), listPieces.map((p) => p.text + p.end).join(''));
    for (const t of ['- one item with more than six words in it', 'A: one item with more than six words in it\n', 'A: one item with more than six words in it\n\n\n', '\n\n- one item with more than six words in it\n\n# H', Array(40).fill('- one item with more than six words in it').join('\n\n')]) check('list round trip', t, t, Checker.pieces(t).map((p) => p.text + p.end).join(''));
    check('mail lines stay', '', 0, Checker.pieces('Subject: one item with more than six words in it\nTo: one item with more than six words in it').filter((p) => p.items).length);
    check('read items', '', [['a b', 'c'], null, null, null], [Checker.readItems('[1] a b\n[2] c', 2), Checker.readItems('[1] a', 2), Checker.readItems('[1] a\n[1] b', 2), Checker.readItems('[1] a\n[3] b', 2)]);
    check('sameness', '', ['involves', ''], [Checker.sameness(['Planning involves x', 'Policy involves y', 'Work involves z', 'Other a b c']), Checker.sameness(['One two three', 'Four five six', 'Seven eight', 'Nine ten'])]);
    const slow = performance.now();
    Checker.judge('word '.repeat(600) + '.', 'other '.repeat(600) + '.');
    Checker.pieces('a. '.repeat(16000));
    Checker.clean('"'.repeat(50000), 'a');
    check('checker speed', '', true, performance.now() - slow < 2000);

    // PDF
    const pdf = String.fromCharCode(...Pdf.render('# Café (draft)\n\nIt costs €5 \\ “now”.\n\n- ' + 'word '.repeat(900) + '\n' + 'x'.repeat(400), 'Tést', DATA.widths));
    check('pdf xref', '', 'xref', pdf.substr(Number(/startxref\n(\d+)/.exec(pdf)[1]), 4));
    [...pdf.matchAll(/^(\d{10}) 00000 n $/gm)].forEach((m, i) => check('pdf object', '', true, pdf.startsWith(`${i + 1} 0 obj`, Number(m[1]))));
    const streams = [...pdf.matchAll(/<< \/Length (\d+) >>\nstream\n([\s\S]*?)endstream/g)];
    for (const m of streams) check('pdf length', '', Number(m[1]), m[2].length);
    check('pdf pages', '', true, streams.length > 1);
    check('pdf words', '', 900, pdf.split('word').length - 1);
    check('pdf escapes', '', true, pdf.includes('(Caf\xE9 \\(draft\\))'));
    check('pdf supports', '', [true, false, false, false], ['naïve “é” €', 'हिन्दी', '₹500', '🚀'].map((s) => Pdf.supports(s)));

    const start = performance.now();
    h.run("It's not just a feature; it's a whole new way — truly — to work, ensuring quality. ".repeat(240), { human: true });
    const ms = Math.round(performance.now() - start);
    check('speed', '', true, ms < 5000);
    out.push(`20k characters in ${ms} ms`);
}

try {
    run();
    out.push(failed ? `${failed} failed, ${passed} passed` : `All ${passed} passed`);
} catch (error) {
    out.push('ERROR ' + error.stack);
}
document.getElementById('out').textContent = out.join('\n');
</script>
</body>
</html>
