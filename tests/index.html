<script>
const h = new Humanizer(RULES);
const out = [];
let passed = 0;
let failed = 0;

function check(kind, input, want, got) {
    if (JSON.stringify(want) === JSON.stringify(got)) {
        passed++;
    } else {
        failed++;
        out.push(`FAIL ${kind}\n  in:   ${input}\n  want: ${JSON.stringify(want)}\n  got:  ${JSON.stringify(got)}`);
    }
}
const text = (input, options) => h.run(input, options).text;
const hits = (r) => [...r.edits, ...r.flags].map((x) => x.pattern);

function run() {
    for (const [input, want] of TESTS.rewrites) {
        check('rewrite', input, want, text(input));
        check('stable', want, want, text(want));
    }
    for (const input of TESTS.untouched) check('untouched', input, input, text(input));
    for (const [input, n] of TESTS.flagged) check('flag', input, true, h.run(input).flags.some((f) => f.pattern === n));
    for (const [input, want] of TESTS.strong) check('strong', input, want, text(input, { strong: true }));
    for (const [input, want] of TESTS.human) check('human', input, want, text(input, { human: true }));
    for (const [input, options, want] of TESTS.recorded) check('recorded ' + JSON.stringify(options), input, want, text(input, options));

    // Patterns SKILL.md marks weak alone must be left when nothing else is wrong.
    const weak = [10, 11, 14, 21];
    for (const [n, kind, input] of TESTS.skill) {
        const found = hits(h.run(input, { type: n === 26 ? 'reply' : 'general' }));
        if (kind === 'After') {
            check(`After §${n}`, input, [], found);
            check(`After strong §${n}`, input, input, text(input, { strong: true }));
        } else {
            check(`Before §${n}`, input, !weak.includes(n), found.includes(n));
        }
    }

    // Options
    check('keep dashes', '', 'A — b, it is important — yes.', text('A — b, it is crucial — yes.', { dashes: true }));
    check('informal lone tell', '', 'lol that was crucial', text('lol that was crucial', { type: 'informal' }));
    check('human informal', '', 'i am fine, it is ok lmk', text('i am fine, it is ok lmk', { human: true, type: 'informal' }));
    check('human reference', '', 'To start, it is not safe. However, the team can.', text('In order to start, it is not safe. However, the team is able to.', { human: true, type: 'reference' }));
    check('tips', '', ['vague', 'in recent years'], h.run('It grew in recent years.', { human: true }).tips[0]);
    check('tips only in human', '', [], h.run('It grew in recent years.', { strong: true }).tips);
    const sample = "I don't think it's that hard — honestly we didn't plan much, and the trip was still vibrant and good. We can't complain about any of it.";
    check('voice', '', "The town is vibrant and we don't mind — it is an important stop — at all.", text('The town is vibrant and we do not mind — it is a crucial stop — at all.', { sample }));
    check('voice long', '', 'We do not help and cannot stay, it was important.', text("We don't help and can't stay, it was crucial.", { sample: 'We do not know what the plan is and we are not sure. '.repeat(3) }));

    // File mode, facts and highlight positions
    const md = '---\ntitle: A crucial — plan\n---\n\n# Notes\n\nThis is a crucial step. See [the guide](docs/crucial--a.md).\n\n| crucial | a — b |\n\n$ delve into --now\n\nC:\\work\\crucial\\x.txt\n\n```\ncrucial — code\n```';
    const file = h.run(md, { strong: true });
    check('file', '', md.replace('a crucial step', 'an important step'), file.text);
    check('sections', '', 2, file.sections);
    check('missing', '', ['12', 'https://a.example/x', 'Lisbon'], h.missing('We saw 12 cats in Lisbon at https://a.example/x today.', 'We saw cats today.'));
    const r = h.run('Ünïcode — “quoted” 🚀 text. Experts believe it helps, ensuring a robust result.');
    for (const f of r.flags) check('offset', r.text, f.text, r.text.slice(f.start, f.end));

    check('missing after a heading', '', [], h.missing('Top Management\nThis is the top.', 'Top Management\nIt is the top.'));

    // Questions
    for (const [q, kind, topics] of [
        ['What is photosynthesis?', 'define', ['photosynthesis']], ['Who was Ashoka', 'define', ['Ashoka']], ['Difference between mitosis and meiosis', 'compare', ['mitosis', 'meiosis']],
        ['what is the difference between TCP and UDP?', 'compare', ['TCP', 'UDP']], ['cat vs dog', 'compare', ['cat', 'dog']], ['Why is the sky blue?', 'why', ['sky blue']], ['When did World War II end?', 'when', ['World War II end']],
        ['How many bones are in the human body', 'number', ['bones are in the human body']], ['Explain the levels of management', 'list', ['levels of management', 'management']], ['Who invented the telephone?', 'who', ['Invention of the telephone', 'telephone']], ['define inertia', 'define', ['inertia']], ['What is the capital of France?', 'fact', ['capital of France', 'France']],
        ['What do you mean by inflation?', 'define', ['inflation']], ['How does a battery work?', 'explain', ['battery']], ['प्रकाश संश्लेषण क्या है?', 'define', ['प्रकाश संश्लेषण']], ['?', 'explain', ['']],

        check('understand', q, [kind, topics], [u.kind, u.topics]);
    }
    for (const [q, v] of [['2+2', 4], ['What is 15% of 2,400?', 360], ['(3 + 4) * 2^3', 56], ['10 / 4', 2.5], ['-3 + 5', 2], ['2^3^2', 512], ['12 x 12', 144], ['1,00,000 + 1', 100001], ['7 ÷ 0', null], ['2+', null], ['alert(1)', null], ['5', null], ['1998', null],
        ['(((((1', null], ['what is 2 plus 2', null], ['2026-11-24', 1991], ['('.repeat(90) + '1+1', null], ['1'.repeat(99) + '*' + '9'.repeat(99), null]]) {
        const c = Ask.calculate(q);
        check('calculate', q, v, c ? c.value : null);
    }
    check('sentences', '', ['Dr. A. Smith met Mr. Hill in the U.S. capital on Monday.', 'He left at once for his own home.'], Ask.sentencesOf('Dr. A. Smith met Mr. Hill in the U.S. capital on Monday. He left at once for his own home. Too short. {\\displaystyle x} is not a sentence at all.'));
    const page = (title, text, order = 0) => ({ title, text, order, url: 'https://en.wikipedia.org/wiki/' + title });
    const leaf = page('Photosynthesis', 'Photosynthesis is the process by which plants turn light into chemical energy.\nIt was discovered over many years by several people.\n\n== Stages ==\nPhotosynthesis has two stages, the light reactions and the Calvin cycle.\nThe stages are:\nLight-dependent reactions\nCalvin cycle\n\n== History ==\nJan Ingenhousz showed in 1779 that light is needed for photosynthesis.\n\n== References ==\nSmith wrote a book about photosynthesis that nobody should see here.');
    const other = page('Plant', 'Plants are living things that mostly make their food by photosynthesis in sunlight.', 1);

    check('finds list lines', '', ['Light-dependent reactions', 'Calvin cycle'], Ask.read(leaf).filter((s) => s.item).map((s) => s.text));
    check('definition first', '', leaf.text.split('\n')[0], pick('What is photosynthesis?', 60).chosen[0].text);

    check('list', '', true, pick('What are the stages of photosynthesis?', 150).chosen.some((s) => s.item));
    check('cover', '', [1, true], [pick('What is photosynthesis?', 60).cover, pick('Who won the cricket photosynthesis cup?', 60).cover < 0.6]);

        ['Explain gravity in detail', 300, 'Explain gravity'], ['Write an essay on water pollution', 300, 'explain water pollution'], ['Explain gravity in short', 90, 'Explain gravity'], ['Who wrote Hamlet?', 80, 'Who wrote Hamlet'], ['What are the causes of inflation?', 260, 'What are the causes of inflation'],

    check('author', '', play.text.split('\n')[0], Ask.choose(Ask.rank(Ask.understand('Who wrote Hamlet?'), [play]), 60).chosen[0].text);

    for (const n of [60, 150, 240]) check('about the asked length', String(n), true, write(n).words >= 0.7 * n && write(n).words <= 1.15 * n + 10);
    check('stays on the subject', '', false, write(240).chosen.some((s) => s.section === 'Schools'));
    check('starts with the topic', '', big.text.split('\n')[0], write(240).chosen[0].text);
    check('whole stretches', '', true, (() => { const c = write(240).chosen.filter((s) => s.section === 'Levels'); return c.filter((s, i) => i && s.place === c[i - 1].place + 1).length >= c.length / 2; })());

    for (const [q, words, left] of [

        ['Define planning (2 marks)', 80, 'Define planning'], ['Critically evaluate the role of a manager in a modern organization', 300, 'explain the role of a manager'],
    ]) check('examiner', q, [words, left], [Ask.understand(q).words >= 260 && words === 300 ? 300 : Ask.understand(q).words, Ask.wish(q).q]);
    for (const [q, n] of [['Explain the levels of management', 3], ['What are the functions of management?', 4], ['Explain the marketing mix', 4], ['What are the types of leadership?', 3], ['Explain the product life cycle', 4], ['Why is the sky blue?', 0], ['What is management?', 0]]) {

    {
        const p = page('Planning', 'Planning is deciding in advance what is to be done by whom. It gives direction to the work of everybody in the firm. In this chapter we will look at planning and at control.\nPlanning is deciding in advance what should be done by whom. However, some plans fail for want of good information.');
        const all = Ask.read({ ...p, order: 0 }).map((x) => ({ ...x, page: p }));
        const got = Ask.clean([{ head: '', chosen: [all[1], all[2], all[3], all[4]], words: 0 }]);
        check('clean', '', [all[0].text, all[1].text], got[0].chosen.map((x) => x.text));
    }
    for (const [from, to] of [['Organizing the behavior of workers', 'Organising the behaviour of workers'], ['the World Trade Organization is a labor matter', 'the World Trade Organization is a labour matter'], ['They analyzed the size of the prize.', 'They analysed the size of the prize.'], ['Centers are centered on skillful, labeled models.', 'Centres are centred on skilful, labelled models.'], ['decentralization and self-actualization', 'decentralisation and self-actualisation'], ['vigorous, humorous and laborious work', 'vigorous, humorous and laborious work'], ['Top management: Organization of work', 'Top management: Organisation of work']]) check('spelling shown', from, to, Ask.british(from));
    for (const [pattern, topic, items, whole = {}] of Ask.ITEMS) {
        check('items are whole', topic, true, items.length > 1 && items.every(([name, words_, title, also, own]) => name && words_ && typeof title === 'string' && (own === undefined || [own.aliases, own.keywords, own.blocked].every((x) => x === undefined || Array.isArray(x)))));
        check('items have patterns', topic, true, [...items.flatMap((x) => (x[4] || {}).blocked || []), ...(whole.blocked || []), ...Object.values(whole.facet_blocked || {}).flat()].every((x) => { try { return Boolean(new RegExp(x, 'iu')); } catch { return false; } }));
    }
    check('long lists', '', [14, 4, 7, true], [Ask.ITEMS.find((x) => x[0].test("Explain Fayol's 14 principles of management"))[2].length, Ask.ITEMS.find((x) => x[0].test('Explain the 4Ps'))[2].length, Ask.ITEMS.find((x) => x[0].test('Explain the 7Ps'))[2].length, Ask.ITEMS.find((x) => x[0].test('Explain management as a science'))[3].claims]);
    for (const [q, parts] of [
        ['Define the terms planning. Explain briefly the steps involved in planning process. (14 marks)', ['What is planning', 'What are the steps in the planning process']], ['Discuss the process and importance of MBO.', ['What are the steps in MBO', 'Explain the importance of MBO']],
        ['What is Plan? How does it differ from planning?', ['What is Plan', 'Difference between Plan and planning']], ['Define index number and mention its uses.', ['What is index number', 'Explain the importance of index number']],
        ['“Management is the art of getting things done through other people”. Explain this statement.', ['What is Management', 'Explain Management is the art of getting things done through other people']], ['What is photosynthesis?', []], ['Why is the sky blue?', []],
    ]) check('parts', q, parts, Parse.plan(q).parts.map((p) => p.q));
    for (const [q, to] of [
        ['planning kya hai', 'What is planning'], ['leadership aur management mein antar', 'Difference between leadership and management'], ['planning ke types batao', 'What are the types of planning'], ['How planning differ from forecasting?', 'Difference between planning and forecasting'],
        ['Distinguish between formal and informal communication.', 'Difference between formal communication and informal communication'], ['Unity of Command.', 'Explain Unity of Command'], ['What are the causes of inflation?', 'What are the causes of inflation'], ['Who wrote Hamlet?', 'Who wrote Hamlet?'], ['महात्मा गांधी कौन थे?', 'महात्मा गांधी कौन थे?'],
    ]) check('read as', q, to, Parse.plan(q).q);
    for (const [q, to] of [['What are its advantages?', 'What are the advantages of planning'], ['iske types batao', 'planning ke types batao'], ['Why is it important?', 'Why is planning important?'], ['What is photosynthesis?', 'What is photosynthesis?'], ['importance', 'Explain the importance of planning']]) check('follow', q, to, Parse.follow(q, 'planning'));
    check('follow nothing', '', 'What are its advantages?', Parse.follow('What are its advantages?', ''));
    check('short forms', '', ['What is management by objectives', 'What is MIS-spelt it', 'What is Foreign Exchange Management Act', 'What is FEMA'], [Parse.long('What is MBO'), Parse.long('What is MIS-spelt it').replace('management information system', 'MIS'), Parse.long('What is FEMA', true), Parse.long('What is FEMA')]);
    const mends = Parse.speller(new Map([['management', 90], ['motivation', 80], ['planning', 70], ['organization', 60], ['photosynthesis', 1]]));
    check('spelling', '', ['management', 'motivation', '', '', ''], ['managment', 'motivaton', 'photosynthesis', 'organisation', 'hamster'].map(mends));
    // The structured query, with a small course: the whole one is measured by tests/evaluate.py.
    check('query without a course', '', [false, 'planning', 'define'], (() => { const r = Parse.query('What is planning?'); return [r.course, r.parts[0].topic, r.command]; })());
    Parse.teach({
        glossary: { subjects: { P: ['management', 'planning | planning process', 'controlling | control', 'management science', 'management as a science', 'levels of management', 'motivation', 'MBO', 'management by objectives | MBO', 'span of control', 'recruitment | recruitment process', "Fayol's 14 principles of management | principles of management"], M: ['marketing', 'quality control'] }, natural: { 'levels of management': 'types', "Fayol's 14 principles of management": 'principles' }, senses: { controlling: [{ topic: 'controlling', subject: 'P' }, { topic: 'quality control', subject: 'M', near: 'production' }] }, hindi: { planning: 'नियोजन|niyojan', controlling: 'नियंत्रण', 'levels of management': 'प्रबंध के स्तर' } },

    for (const [q, to] of [
        ['Q.3 (a) Define planing. Explain its types and importance. (10 marks)', 'planning:definition; planning:types; planning:importance | explain | 10 | 400 | en'],

        ['Write a short note on MBO', 'MBO:short-note | short-note |  | 400 | en'], ['Unit 2, Section B, Q.5 (b) Distinguish between planning and control with reference to Indian context. (2M)', 'planning and controlling:comparison | compare | 2 | 50 | en'],
        ['Explain in detail the process of planning. Also briefly explain the types of control. (3 marks)', 'planning:process*1.5; controlling:types*0.5 | explain | 3 | 80 | en'], ['niyojan ke fayde aur nuksan samjhao', 'planning:advantages; planning:limitations | explain |  | 400 | hinglish'],

    const one = { asked: { kind: 'explain', topics: ['planning'], q: 'explain planning' }, sure: true, parts: [{ head: '', words: 80, chosen: [line(long('Planning'), '', 0), line(long('Strategy'), 'Types', 1), line(long('Budgeting'), 'Types', 2), line(long('Checking'), 'Steps', 3)] }] };
    const shaped = Ask.exam(one, [line('Planning is essential to the success of a firm in a changing market.', '', 9)]);
    check('exam form', '', ['Introduction|', 'Explanation|1. Types', '|2. Steps', 'Conclusion|'], shaped.parts.map((p) => `${p.head}|${p.sub}`));
    check('exam keeps every sentence', '', one.parts[0].chosen.map((x) => x.text), shaped.parts.slice(0, -1).flatMap((p) => p.chosen.map((x) => x.text)));
    check('exam leaves a fact alone', '', one.parts, Ask.exam({ ...one, asked: { ...one.asked, kind: 'fact' } }).parts);
    for (const [q, core] of [['Explain determinants of working capital', 'working capital'], ['Explain types of plans', 'plan'], ['Explain the levels of management', 'management']]) check('core', q, core, (() => { const got = Ask.coreOf(Ask.understand(q)).join(' '); return core.split(' ').every((w) => got.includes(w.slice(0, 4))) && got.split(' ').length === core.split(' ').length ? core : got; })());
    check('off topic', '', false, Ask.onTopic(Ask.coreOf(Ask.understand('Explain determinants of working capital')), { title: 'Labor Productivity', text: 'The determinants of growth are human capital and technology in every modern land.\nCapital makes people more productive than they would be without any of it.' }));
    check('on topic', '', true, Ask.onTopic(Ask.coreOf(Ask.understand('Explain determinants of working capital')), { title: 'Working capital', text: 'x' }));
    const isSure = (q) => Ask.sure(Ask.understand(q), pick(q, 60));
    check('sure', '', [true, true, false, false], [isSure('What is photosynthesis?'), isSure('When was light shown to be needed for photosynthesis?'), isSure('Why is photosynthesis slow?'), isSure('Who won the cricket photosynthesis cup?')]);
    const found = (...titles) => titles.map((title, i) => ({ title, pageid: title.length * 100 + i }));
    check('titles', '', 'Management', Ask.pickTitles([found('Flat organization', 'Management', 'Middle management'), found('Management', 'Project management')], Ask.understand('What are the levels of management?'))[0].title);
    check('titles why', '', 'Diffuse sky radiation', Ask.pickTitles([found('Diffuse sky radiation', 'Sky blue'), found('Sky blue', 'Blue Sky')], Ask.understand('Why is the sky blue?'))[0].title);
    const peak = page('Mount Everest', 'Mount Everest is a mountain between two countries in Asia.\nIts elevation of 8,848 metres was measured again in 2020 by both countries.\n\n== Climate ==\nThe closest sea to Mount Everest is 700 km away from the top.');
    check('kin', '', true, Ask.choose(Ask.rank(Ask.understand('How tall is Mount Everest?'), [peak]), 60).chosen.some((x) => /8,848/.test(x.text)));
    const paint = page('Sky blue', 'Sky blue refers to shades like the colour of the sky in the day.\nCoventry City have had sky blue as their colour since the 1960s.');
    check('no reason, not sure', '', false, Ask.sure(Ask.understand('Why is the sky blue?'), Ask.choose(Ask.rank(Ask.understand('Why is the sky blue?'), [paint]), 150)));
    // Sure only when a sentence answers; otherwise the page says so.
    const ask = (q, ...pages) => { const u = Ask.understand(q); const got = Ask.choose(Ask.rank(u, pages), u.words); return [got.chosen.map((s) => s.text).join(' '), Ask.sure(u, got)]; };
    const art = (title, ...lines) => page(title, lines.join('\n'));
    const everest = art('Mount Everest', 'Mount Everest is the highest mountain on Earth above sea level.', 'Its height was most recently measured in 2020 by both countries as 8,848.86 m (29,031 ft).', 'To approximate a climb of the entire height of Mount Everest, one would start from the coast in 1990.', '', '== Plants ==', 'A plant called Arenaria grows below 5,500 metres (18,000 ft) in the region of the mountain.');
    const low = art('Mount Everest', 'Mount Everest is the highest mountain on Earth above sea level.', '', '== Plants ==', 'A plant called Arenaria grows below 5,500 metres (18,000 ft) in the region of the mountain.');
    const taj = art('Taj Mahal', 'The Taj Mahal is a white mausoleum on the bank of the river in Agra.', 'It was commissioned in 1631 by the emperor Shah Jahan for his wife.');
    const hotel = { ...art('Taj Mahal Palace Hotel', 'Built in the Indo-Saracenic style, it opened in 1903 as the Taj Mahal Hotel in Bombay.'), order: 1 };
    const gravity = art('Gravity', 'Gravity is the attraction between all things that have mass.', 'The Greek philosopher Archimedes discovered the center of gravity of a triangle.');
    const moon = art('Moon', 'The Moon is the only natural satellite of the planet Earth.', 'The splitting of the Moon is a miracle attributed to the prophet Mohammad.');
    const radium = art('Radium', 'Radium is a chemical element with the symbol Ra and number 88.', 'Radium was discovered by Marie and Pierre Curie in a sample of ore.');
    const phone = art('Telephone', 'A telephone is a device that lets people talk over a long distance.', 'It can be argued that Bell invented the telephone industry in that country.');
    const light = art('Speed of light', 'The speed of light is the speed of electromagnetic waves in space.');
    const lightly = art('Speed of light', 'The speed of light in vacuum is exactly 299,792,458 metres per second.');
    const yen = art('Japanese mon', 'The mon was the currency of Japan from the Muromachi period in 1336 until 1870.');
    const yens = art('Japanese yen', 'The yen is the official currency of Japan and is used by many banks.');
    const capital = art('Capital punishment in Australia', 'Capital punishment in Australia was a form of punishment in the past.');
    const sea = art('Sea', 'A sea is a very large body of salty water on a planet.', 'Meanwhile, the Red Sea is very salty due to its high evaporation rate.');
    const bones = art('Human skeleton', 'The human skeleton is the internal frame of the human body.', 'It is made of 206 bones in a grown human body, and more in a child.');
    const town = art('Guernica', 'Guernica is a town in the province of Biscay in the north of Spain.', 'In 1937, Guernica was bombed by the Condor Legion of Nazi Germany from the air.');
    const mural = art('Guernica (Picasso)', 'Guernica is a large 1937 oil painting by the Spanish artist Pablo Picasso.');
    const ferris = art('Ferris wheel', 'Two triple wheels were built for clients in Asia: Tree Triple Wheel in Japan and one more.');
    const solar = art('Outline of the Solar System', 'Of those objects, the largest eight are the planets of the Solar System.');
    const house = art('Farnsworth House', 'The house is raised 5 feet (1.6 m) above the ground on white columns.');
    const hundred = art('Hindi', 'दिल्ली भारत की राजधानी है और यहाँ संसद भवन भी स्थित है।');
    for (const [q, pages, wanted, sure] of [
        ['How tall is Mount Everest?', [everest], /8,848/, true], ['How tall is Mount Everest?', [low], /./, false], ['When was the Taj Mahal built?', [taj, hotel], /1631/, true],
        ['Who discovered gravity?', [gravity], /./, false], ['Who invented the moon?', [moon], /./, false], ['Who discovered radium?', [radium], /Curie/, true], ['Who invented the telephone?', [phone], /./, false],
        ['What is the speed of light?', [light], /./, false], ['What is the speed of light?', [lightly], /299/, true], ['What is the currency of Japan?', [yen], /./, false], ['What is the currency of Japan?', [yens], /yen/, true],
        ['What is the capital of Australia?', [capital], /./, false], ['Why is the sea salty?', [sea], /./, false], ['How many bones are in the human body?', [bones], /206/, true], ['What is the largest planet in the Solar System?', [solar], /./, false],
        ['Who painted Guernica?', [town], /./, false], ['Who painted Guernica?', [mural], /Picasso/, true], ['How many wheels does a tree have?', [ferris], /./, false],
        ['How tall is my house?', [house], /./, false], ['भारत की राजधानी क्या है?', [hundred], /दिल्ली/, true],
    ]) {
        const [text, isit] = ask(q, ...pages);
        check('answers', q, [true, sure], [wanted.test(text) || !sure, isit]);
    }
    check('no hotel', '', false, /1903/.test(ask('When was the Taj Mahal built?', taj, hotel)[0]));
    check('empty brackets', '', 'Mitosis is a part of the cell cycle of many living things.', Ask.read(art('Mitosis', 'Mitosis () is a part of the cell cycle of many living things.'))[0].text);
    check('asked length', '', [true, false], [Ask.understand('Explain x in 200 words').told, Ask.understand('Explain x').told]);
    const roles = art('Management', 'Management is the work of running an organization and all its people.', 'Organizations generally have three levels of managers:', 'Senior management roles include the board and a chief executive of the whole firm.', 'Middle management roles include branch managers and regional managers of a large firm.', 'Line management roles include supervisors and team leaders who oversee the daily work.', 'Management is taught as a subject at many universities around the world.', 'In 2013, a survey of 160 directors found that 10% of firms never rated the chief.');
    const levels = ask('Explain the levels of management in 60 to 120 words', roles)[0];
    check('every level, nothing else', '', [true, true, true, false, false], [/Senior/, /Middle/, /Line/, /universities/, /survey/].map((x) => x.test(levels)));
    check('titles extra words', '', 'Photosynthesis', Ask.pickTitles([found('Artificial photosynthesis', 'Photosynthesis')], Ask.understand('What is photosynthesis?'))[0].title);
    const fast = performance.now();
    Ask.rank(Ask.understand('What is photosynthesis?'), [page('Photosynthesis', (leaf.text + '\n').repeat(350))]);
    for (const x of ['a ', '. ', 'A. ', '( ', '=', '1+', ' ', 'of the ', 'difference between ']) Ask.understand((x.repeat(300)).slice(0, 300));
    Ask.sentencesOf('A. '.repeat(60000));
    check('ask speed', '', true, performance.now() - fast < 4000);

    // PDF
    const pdf = String.fromCharCode(...Pdf.render('# Café (draft)\n\nIt costs €5 \\ “now”.\n\n- ' + 'word '.repeat(900) + '\n' + 'x'.repeat(400), 'Tést', DATA.widths));
    check('pdf xref', '', 'xref', pdf.substr(Number(/startxref\n(\d+)/.exec(pdf)[1]), 4));
    [...pdf.matchAll(/^(\d{10}) 00000 n $/gm)].forEach((m, i) => check('pdf object', '', true, pdf.startsWith(`${i + 1} 0 obj`, Number(m[1]))));
    const streams = [...pdf.matchAll(/<< \/Length (\d+) >>\nstream\n([\s\S]*?)endstream/g)];
    for (const m of streams) check('pdf length', '', Number(m[1]), m[2].length);
    check('pdf pages', '', true, streams.length > 1);
    check('pdf words', '', 900, pdf.split('word').length - 1);
    check('pdf escapes', '', true, pdf.includes('(Caf\xE9 \\(draft\\))'));
    check('pdf supports', '', [true, false, false, false], ['naïve “é” €', 'हिन्दी', '₹500', '🚀'].map((s) => Pdf.supports(s)));

    const start = performance.now();
    h.run("It's not just a feature; it's a whole new way — truly — to work, ensuring quality. ".repeat(240), { human: true });
    const ms = Math.round(performance.now() - start);
    check('speed', '', true, ms < 5000);
    out.push(`20k characters in ${ms} ms`);
}

try {
    run();
    out.push(failed ? `${failed} failed, ${passed} passed` : `All ${passed} passed`);
} catch (error) {
    out.push('ERROR ' + error.stack);
}
document.getElementById('out').textContent = out.join('\n');
</script>
</body>
</html>
