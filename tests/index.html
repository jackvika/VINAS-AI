<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tests | VINAS AI</title>
</head>
<body>
<pre id="out">Running</pre>
<script src="../static/rules.js"></script>
<script src="../static/content.js"></script>
<script src="../static/brain.js"></script>
<script src="../static/engine.js"></script>
<script src="../static/pdf.js"></script>
<script src="../static/mind.js"></script>
<script src="../static/ask.js"></script>
<script src="cases.js"></script>
<script>
const h = new Humanizer(RULES);
const out = [];
let passed = 0;
let failed = 0;

function check(kind, input, want, got) {
    if (JSON.stringify(want) === JSON.stringify(got)) {
        passed++;
    } else {
        failed++;
        out.push(`FAIL ${kind}\n  in:   ${input}\n  want: ${JSON.stringify(want)}\n  got:  ${JSON.stringify(got)}`);
    }
}
const text = (input, options) => h.run(input, options).text;
const hits = (r) => [...r.edits, ...r.flags].map((x) => x.pattern);

function run() {
    for (const [input, want] of TESTS.rewrites) {
        check('rewrite', input, want, text(input));
        check('stable', want, want, text(want));
    }
    for (const input of TESTS.untouched) check('untouched', input, input, text(input));
    for (const [input, n] of TESTS.flagged) check('flag', input, true, h.run(input).flags.some((f) => f.pattern === n));
    for (const [input, want] of TESTS.strong) check('strong', input, want, text(input, { strong: true }));
    for (const [input, want] of TESTS.human) check('human', input, want, text(input, { human: true }));
    for (const [input, options, want] of TESTS.recorded) check('recorded ' + JSON.stringify(options), input, want, text(input, options));

    // Patterns SKILL.md marks weak alone must be left when nothing else is wrong.
    const weak = [10, 11, 14, 21];
    for (const [n, kind, input] of TESTS.skill) {
        const found = hits(h.run(input, { type: n === 26 ? 'reply' : 'general' }));
        if (kind === 'After') {
            check(`After §${n}`, input, [], found);
            check(`After strong §${n}`, input, input, text(input, { strong: true }));
        } else {
            check(`Before §${n}`, input, !weak.includes(n), found.includes(n));
        }
    }

    // Options
    check('keep dashes', '', 'A — b, it is important — yes.', text('A — b, it is crucial — yes.', { dashes: true }));
    check('informal lone tell', '', 'lol that was crucial', text('lol that was crucial', { type: 'informal' }));
    check('human informal', '', 'i am fine, it is ok lmk', text('i am fine, it is ok lmk', { human: true, type: 'informal' }));
    check('human reference', '', 'To start, it is not safe. However, the team can.', text('In order to start, it is not safe. However, the team is able to.', { human: true, type: 'reference' }));
    check('tips', '', ['vague', 'in recent years'], h.run('It grew in recent years.', { human: true }).tips[0]);
    check('tips only in human', '', [], h.run('It grew in recent years.', { strong: true }).tips);
    const sample = "I don't think it's that hard — honestly we didn't plan much, and the trip was still vibrant and good. We can't complain about any of it.";
    check('voice', '', "The town is vibrant and we don't mind — it is an important stop — at all.", text('The town is vibrant and we do not mind — it is a crucial stop — at all.', { sample }));
    check('voice long', '', 'We do not help and cannot stay, it was important.', text("We don't help and can't stay, it was crucial.", { sample: 'We do not know what the plan is and we are not sure. '.repeat(3) }));

    // File mode, facts and highlight positions
    const md = '---\ntitle: A crucial — plan\n---\n\n# Notes\n\nThis is a crucial step. See [the guide](docs/crucial--a.md).\n\n| crucial | a — b |\n\n$ delve into --now\n\nC:\\work\\crucial\\x.txt\n\n```\ncrucial — code\n```';
    const file = h.run(md, { strong: true });
    check('file', '', md.replace('a crucial step', 'an important step'), file.text);
    check('sections', '', 2, file.sections);
    check('missing', '', ['12', 'https://a.example/x', 'Lisbon'], h.missing('We saw 12 cats in Lisbon at https://a.example/x today.', 'We saw cats today.'));
    const r = h.run('Ünïcode — “quoted” 🚀 text. Experts believe it helps, ensuring a robust result.');
    for (const f of r.flags) check('offset', r.text, f.text, r.text.slice(f.start, f.end));

    check('missing after a heading', '', [], h.missing('Top Management\nThis is the top.', 'Top Management\nIt is the top.'));

    // Questions
    for (const [q, kind, topics] of [
        ['What is photosynthesis?', 'define', ['photosynthesis']], ['Who was Ashoka', 'define', ['Ashoka']], ['Difference between mitosis and meiosis', 'compare', ['mitosis', 'meiosis']],
        ['what is the difference between TCP and UDP?', 'compare', ['TCP', 'UDP']], ['cat vs dog', 'compare', ['cat', 'dog']], ['Why is the sky blue?', 'why', ['sky blue']], ['When did World War II end?', 'when', ['World War II end']],
        ['How many bones are in the human body', 'number', ['bones are in the human body']], ['Explain the levels of management', 'list', ['levels of management', 'management']], ['Who invented the telephone?', 'who', ['Invention of the telephone', 'telephone']], ['define inertia', 'define', ['inertia']], ['What is the capital of France?', 'fact', ['capital of France', 'France']],
        ['What do you mean by inflation?', 'define', ['inflation']], ['How does a battery work?', 'explain', ['battery']], ['प्रकाश संश्लेषण क्या है?', 'define', ['प्रकाश संश्लेषण']], ['?', 'explain', ['']],
    ]) {
        const u = Ask.understand(q);
        check('understand', q, [kind, topics], [u.kind, u.topics]);
    }
    for (const [q, v] of [['2+2', 4], ['What is 15% of 2,400?', 360], ['(3 + 4) * 2^3', 56], ['10 / 4', 2.5], ['-3 + 5', 2], ['2^3^2', 512], ['12 x 12', 144], ['1,00,000 + 1', 100001], ['7 ÷ 0', null], ['2+', null], ['alert(1)', null], ['5', null], ['1998', null],
        ['(((((1', null], ['what is 2 plus 2', null], ['2026-11-24', 1991], ['('.repeat(90) + '1+1', null], ['1'.repeat(99) + '*' + '9'.repeat(99), null]]) {
        const c = Ask.calculate(q);
        check('calculate', q, v, c ? c.value : null);
    }
    check('sentences', '', ['Dr. A. Smith met Mr. Hill in the U.S. capital on Monday.', 'He left at once for his own home.'], Ask.sentencesOf('Dr. A. Smith met Mr. Hill in the U.S. capital on Monday. He left at once for his own home. Too short. {\\displaystyle x} is not a sentence at all.'));
    const page = (title, text, order = 0) => ({ title, text, order, url: 'https://en.wikipedia.org/wiki/' + title });
    const leaf = page('Photosynthesis', 'Photosynthesis is the process by which plants turn light into chemical energy.\nIt was discovered over many years by several people.\n\n== Stages ==\nPhotosynthesis has two stages, the light reactions and the Calvin cycle.\nThe stages are:\nLight-dependent reactions\nCalvin cycle\n\n== History ==\nJan Ingenhousz showed in 1779 that light is needed for photosynthesis.\n\n== References ==\nSmith wrote a book about photosynthesis that nobody should see here.');
    const other = page('Plant', 'Plants are living things that mostly make their food by photosynthesis in sunlight.', 1);
    const pick = (q, n) => Ask.choose(Ask.rank(Ask.understand(q), [leaf, other]), n);
    check('skips references', '', false, Ask.read(leaf).some((s) => /nobody/.test(s.text)));
    check('finds list lines', '', ['Light-dependent reactions', 'Calvin cycle'], Ask.read(leaf).filter((s) => s.item).map((s) => s.text));
    check('definition first', '', leaf.text.split('\n')[0], pick('What is photosynthesis?', 60).chosen[0].text);
    check('date', '', true, pick('When was light shown to be needed for photosynthesis?', 60).chosen.some((x) => x.text.includes('1779')));
    check('list', '', true, pick('What are the stages of photosynthesis?', 150).chosen.some((s) => s.item));
    check('cover', '', [1, true], [pick('What is photosynthesis?', 60).cover, pick('Who won the cricket photosynthesis cup?', 60).cover < 0.6]);
    for (const [q, words, left] of [
        ['Explain democracy in 200 words', 200, 'Explain democracy'], ['What is inflation? (150-250 words)', 200, 'What is inflation'], ['Write in 300 words about climate change', 300, 'about climate change'], ['लोकतंत्र क्या है 100 शब्दों में', 100, 'लोकतंत्र क्या है'],
        ['Explain gravity in detail', 300, 'Explain gravity'], ['Write an essay on water pollution', 300, 'explain water pollution'], ['Explain gravity in short', 90, 'Explain gravity'], ['Who wrote Hamlet?', 80, 'Who wrote Hamlet'], ['What are the causes of inflation?', 260, 'What are the causes of inflation'],
        ['Explain x in 5000 words', 800, 'Explain x'], ['How many words are in English?', 60, 'How many words are in English'],
    ]) check('length', q, [words, left], [Ask.understand(q).words, Ask.wish(q).q]);
    const things = 'budget plan market branch law brand factory price goal risk team shift report skill rule machine order stock safety visit sale loan wage school road port farm mine bank ship'.split(' ');
    const para = (w, n) => Array.from({ length: n }, (_, i) => { const k = { top: 0, middle: 10, line: 20 }[w] + 2 * i; return `At the ${w} level of management people look after the ${things[k % 30]} and the ${things[(k + 1) % 30]} of the whole firm.`; }).join(' ');
    const big = page('Management', 'Management is the work of running an organization and its people.\nManagers plan, organize, lead and check the work that others do each day.\n\n== Levels ==\n' + para('top', 5) + '\n' + para('middle', 5) + '\n' + para('line', 5) + '\n\n== Schools ==\nMany universities teach courses in business and finance to young people.');
    const write = (n) => Ask.choose(Ask.rank(Ask.understand('What are the levels of management?'), [big]), n);
    const play = page('Hamlet', 'Hamlet is a tragedy by the English playwright William Shakespeare from about 1600.\nIt is the longest of his plays and is often performed.\n\n== Derivative works ==\nGilbert wrote a short comic play about Hamlet that few people know today.');
    check('author', '', play.text.split('\n')[0], Ask.choose(Ask.rank(Ask.understand('Who wrote Hamlet?'), [play]), 60).chosen[0].text);
    check('asides', '', [false, true], ['Who wrote Hamlet?', 'What are the derivative works of Hamlet?'].map((q) => Ask.choose(Ask.rank(Ask.understand(q), [play]), 150).chosen.some((x) => /Gilbert/.test(x.text))));
    for (const n of [60, 150, 240]) check('about the asked length', String(n), true, write(n).words >= 0.7 * n && write(n).words <= 1.15 * n + 10);
    check('stays on the subject', '', false, write(240).chosen.some((s) => s.section === 'Schools'));
    check('starts with the topic', '', big.text.split('\n')[0], write(240).chosen[0].text);
    check('whole stretches', '', true, (() => { const c = write(240).chosen.filter((s) => s.section === 'Levels'); return c.filter((s, i) => i && s.place === c[i - 1].place + 1).length >= c.length / 2; })());
    const isSure = (q) => Ask.sure(Ask.understand(q), pick(q, 60));
    check('sure', '', [true, true, false, false], [isSure('What is photosynthesis?'), isSure('When was light shown to be needed for photosynthesis?'), isSure('Why is photosynthesis slow?'), isSure('Who won the cricket photosynthesis cup?')]);
    const found = (...titles) => titles.map((title, i) => ({ title, pageid: title.length * 100 + i }));
    check('titles', '', 'Management', Ask.pickTitles([found('Flat organization', 'Management', 'Middle management'), found('Management', 'Project management')], Ask.understand('What are the levels of management?'))[0].title);
    check('titles why', '', 'Diffuse sky radiation', Ask.pickTitles([found('Diffuse sky radiation', 'Sky blue'), found('Sky blue', 'Blue Sky')], Ask.understand('Why is the sky blue?'))[0].title);
    const peak = page('Mount Everest', 'Mount Everest is a mountain between two countries in Asia.\nIts elevation of 8,848 metres was measured again in 2020 by both countries.\n\n== Climate ==\nThe closest sea to Mount Everest is 700 km away from the top.');
    check('kin', '', true, Ask.choose(Ask.rank(Ask.understand('How tall is Mount Everest?'), [peak]), 60).chosen.some((x) => /8,848/.test(x.text)));
    const paint = page('Sky blue', 'Sky blue refers to shades like the colour of the sky in the day.\nCoventry City have had sky blue as their colour since the 1960s.');
    check('no reason, not sure', '', false, Ask.sure(Ask.understand('Why is the sky blue?'), Ask.choose(Ask.rank(Ask.understand('Why is the sky blue?'), [paint]), 150)));
    check('titles extra words', '', 'Photosynthesis', Ask.pickTitles([found('Artificial photosynthesis', 'Photosynthesis')], Ask.understand('What is photosynthesis?'))[0].title);
    const fast = performance.now();
    Ask.rank(Ask.understand('What is photosynthesis?'), [page('Photosynthesis', (leaf.text + '\n').repeat(350))]);
    for (const x of ['a ', '. ', 'A. ', '( ', '=', '1+', ' ', 'of the ', 'difference between ']) Ask.understand((x.repeat(300)).slice(0, 300));
    Ask.sentencesOf('A. '.repeat(60000));
    check('ask speed', '', true, performance.now() - fast < 4000);

    // PDF
    const pdf = String.fromCharCode(...Pdf.render('# Café (draft)\n\nIt costs €5 \\ “now”.\n\n- ' + 'word '.repeat(900) + '\n' + 'x'.repeat(400), 'Tést', DATA.widths));
    check('pdf xref', '', 'xref', pdf.substr(Number(/startxref\n(\d+)/.exec(pdf)[1]), 4));
    [...pdf.matchAll(/^(\d{10}) 00000 n $/gm)].forEach((m, i) => check('pdf object', '', true, pdf.startsWith(`${i + 1} 0 obj`, Number(m[1]))));
    const streams = [...pdf.matchAll(/<< \/Length (\d+) >>\nstream\n([\s\S]*?)endstream/g)];
    for (const m of streams) check('pdf length', '', Number(m[1]), m[2].length);
    check('pdf pages', '', true, streams.length > 1);
    check('pdf words', '', 900, pdf.split('word').length - 1);
    check('pdf escapes', '', true, pdf.includes('(Caf\xE9 \\(draft\\))'));
    check('pdf supports', '', [true, false, false, false], ['naïve “é” €', 'हिन्दी', '₹500', '🚀'].map((s) => Pdf.supports(s)));

    const start = performance.now();
    h.run("It's not just a feature; it's a whole new way — truly — to work, ensuring quality. ".repeat(240), { human: true });
    const ms = Math.round(performance.now() - start);
    check('speed', '', true, ms < 5000);
    out.push(`20k characters in ${ms} ms`);
}

try {
    run();
    out.push(failed ? `${failed} failed, ${passed} passed` : `All ${passed} passed`);
} catch (error) {
    out.push('ERROR ' + error.stack);
}
document.getElementById('out').textContent = out.join('\n');
</script>
</body>
</html>
